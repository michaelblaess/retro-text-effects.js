name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Build single-file bundle
        run: npm run build

      - name: Upload dist as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: retro-text-effects
          path: dist/

      - name: Attach single file to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/retro-text-effects.js
            dist/retro-text-effects.min.js
